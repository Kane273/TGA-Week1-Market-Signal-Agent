kind = "web"
previewPath = "/"
title = "Stock Analyzer"
description = "NASDAQ stock analysis app with live market data, stock screener, top picks scoring, and a local AI agent — built with Streamlit and Python."
version = "1.0.0"
id = "artifacts/stock-analyzer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18797

[services.development]
run = "streamlit run /home/runner/workspace/streamlit-app/app.py --server.port $PORT --server.address 0.0.0.0"

[services.env]
PORT = "18797"
BASE_PATH = "/"

[services.production]

[services.production.build]
args = ["bash", "-lc", "python -m pip install --no-cache-dir -r streamlit-app/requirements.txt"]

[services.production.run]
args = ["bash", "-lc", "streamlit run streamlit-app/app.py --server.address 0.0.0.0 --server.port ${PORT}"]